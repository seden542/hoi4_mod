 SED.10.t:0 "독일의 오스트리아 통합 요구"
 SED.10.d:0 "독일 정부가 오스트리아의 정치적 통합을 요구했다. 우리는 이에 응할 수도, 거부할 수도 있다."
 SED.10.a:0 "통합을 받아들인다"
 SED.10.b:0 "거부한다"
 SED.11.t:0 "독일의 영토 요구"
 SED.11.d:0 "독일 정부가 우리 영토 일부의 이양을 요구했다. 굴복할 것인가, 저항할 것인가?"
 SED.11.a:0 "요구를 수용한다"
 SED.11.b:0 "단호히 거부한다"
 SED.12.t:0 "단치히와 국경 문제"
 SED.12.d:0 "독일이 단치히와 동부 국경 문제에 대한 새로운 합의를 요구했다."
 SED.12.a:0 "협상에 응한다"
 SED.12.b:0 "거부하고 저항한다"
