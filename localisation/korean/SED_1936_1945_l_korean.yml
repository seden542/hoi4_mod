l_korean:
 SED.30.t:0 "1936년 국가재건회의"
 SED.30.d:0 "새 정부는 재건의 우선순위를 놓고 논쟁에 들어섰다. 산업과 방위, 사회 안정 가운데 무엇을 먼저 선택할지가 국가의 다음 단계에 영향을 줄 것이다."
 SED.30.a:0 "산업과 생산을 우선한다"
 SED.30.b:0 "국가 방위와 재무장을 우선한다"
 SED.31.t:0 "재무장 논쟁"
 SED.31.d:0 "1936년의 재건이 진행되면서 국방력을 얼마나 빠르게 확대할 것인지 결정해야 한다."
 SED.31.a:0 "재무장을 서두른다"
 SED.31.b:0 "민간경제 회복을 우선한다"
 SED.32.t:0 "1937년 군제개혁위원회"
 SED.32.d:0 "새로운 육군 조직과 지휘체계를 둘러싼 개혁안이 상정되었다."
 SED.32.a:0 "참모체계를 개혁한다"
 SED.32.b:0 "기존 체계를 유지한다"
 SED.33.t:0 "중부유럽 경제회의"
 SED.33.d:0 "1937년, 주변국과의 경제 관계를 장기적으로 어떻게 구성할지 결정해야 한다."
 SED.33.a:0 "무역망을 확대한다"
 SED.33.b:0 "경제적 자립을 강화한다"
 SED.34.t:0 "독일의 최종 통합 요구"
 SED.34.d:0 "1938년, 독일의 정치적 통합 문제가 더 이상 미룰 수 없는 현안이 되었다."
 SED.34.a:0 "통합 협상을 개시한다"
 SED.35.t:0 "오스트리아 문제"
 SED.35.d:0 "독일 통합 이후 오스트리아의 장래가 유럽 외교의 핵심 현안이 되었다."
 SED.35.a:0 "통합 요구를 보낸다"
 SED.36.t:0 "체코슬로바키아 위기"
 SED.36.d:0 "중부유럽 국경과 체코슬로바키아의 향방을 두고 긴장이 높아졌다."
 SED.36.a:0 "영토 요구를 제시한다"
 SED.37.t:0 "단치히 최종 협상"
 SED.37.d:0 "1939년, 단치히와 동부 국경 문제가 마지막 외교 단계에 들어섰다."
 SED.37.a:0 "최종 요구를 전달한다"
 SED.38.t:0 "폴란드의 거부"
 SED.38.d:0 "폴란드는 요구를 거부했다. 이제 외교적 해결은 사실상 막혔다."
 SED.38.a:0 "전쟁 계획을 실행한다"
 SED.39.t:0 "총동원령"
 SED.39.d:0 "유럽에서 전쟁이 시작되면서 국가 전체를 전쟁 수행 체계로 전환해야 한다."
 SED.39.a:0 "총동원을 선포한다"
 SED.39.b:0 "제한 동원을 유지한다"
 SED.40.t:0 "유럽 전쟁의 확대"
 SED.40.d:0 "1939년 말, 국지적인 충돌은 유럽 전역을 휩쓰는 전쟁으로 확대되고 있다."
 SED.40.a:0 "전시 체제로 전환한다"
 SED.40.b:0 "단기전을 기대한다"
 SED.41.t:0 "1940년 서부전선의 결단"
 SED.41.d:0 "서부에서 결정적인 작전을 감행할지 방어 태세를 유지할지 선택해야 한다."
 SED.41.a:0 "서부 공세를 승인한다"
 SED.41.b:0 "방어선 강화를 선택한다"
 SED.42.t:0 "대서양과 해상보급"
 SED.42.d:0 "1940년 이후 해상 보급선과 대서양 접근성이 새로운 전략적 문제로 떠올랐다."
 SED.42.a:0 "해상전과 항공전에 집중한다"
 SED.42.b:0 "육상전 준비를 우선한다"
 SED.43.t:0 "1941년 동부전선 논의"
 SED.43.d:0 "동쪽의 거대한 전선을 열 것인지, 전쟁을 더 늦출 것인지 결정해야 한다."
 SED.43.a:0 "동부전선을 준비한다"
 SED.43.b:0 "동쪽 전쟁을 유예한다"
 SED.44.t:0 "전시 통합사령부"
 SED.44.d:0 "1941년 이후 전쟁 규모가 커지면서 각 군과 정부를 하나의 체계로 묶을 필요가 생겼다."
 SED.44.a:0 "통합사령부를 설치한다"
 SED.44.b:0 "기존 지휘체계를 유지한다"
 SED.45.t:0 "1942년 장기전 경제"
 SED.45.d:0 "단기전 예상이 무너지면서 장기전 경제를 위한 새로운 국가 계획이 필요해졌다."
 SED.45.a:0 "전시경제를 심화한다"
 SED.45.b:0 "민간 생산을 보호한다"
 SED.46.t:0 "1943년 총력전의 비용"
 SED.46.d:0 "전쟁의 비용과 자원 부족이 국가 운영을 압박하기 시작했다."
 SED.46.a:0 "전쟁 생산을 계속 확대한다"
 SED.46.b:0 "경제 구조를 재조정한다"
 SED.47.t:0 "1944년 마지막 방어선"
 SED.47.d:0 "전선이 좁혀지면서 후방과 방어선 전체를 다시 설계해야 한다."
 SED.47.a:0 "방어선을 재편한다"
 SED.47.b:0 "기동 예비대를 유지한다"
 SED.48.t:0 "1945년의 결산"
 SED.48.d:0 "전쟁의 끝이 다가오고 있다. 국가는 전시체제를 정리하고 새로운 질서를 준비해야 한다."
 SED.48.a:0 "전시체제를 정리한다"
 SED.48.b:0 "전쟁체제를 유지한다"
