l_korean:
 SED_first_step:0 "세든의 첫걸음"
 SED_first_step_desc:0 "새로운 시대를 향한 첫발을 내딛는다."
 SED_rebuild_the_nation:0 "국가 재건"
 SED_rebuild_the_nation_desc:0 "전쟁과 혼란으로 약화된 국가를 재건하고 새로운 시대를 준비한다."
 SED_rearmament:0 "재무장"
 SED_rearmament_desc:0 "군사적 제약을 벗어나 국가의 방위력을 다시 구축한다."
 SED_rhineland_remilitarization:0 "라인란트 재무장"
 SED_rhineland_remilitarization_desc:0 "라인란트에 대한 군사적 통제권을 회복하고 베르사유 체제에 정면으로 도전한다."
 SED_sebensraum:0 "세벤스라움"
 SED_sebensraum_desc:0 "세드만족의 역사적 생활권과 독일의 영향권을 하나의 거대한 국가적 목표로 묶는다."
 SED_korean_empire_alliance:0 "대한제국과의 동맹"
 SED_korean_empire_alliance_desc:0 "유럽과 동아시아의 두 강대국 사이에 군사·경제적 협력 체계를 구축한다."
 SED_prepare_for_total_war:0 "총력전 준비"
 SED_prepare_for_total_war_desc:0 "다가오는 세계적 충돌에 대비하여 국가의 모든 역량을 동원한다."
 SED_complete_sebensraum:0 "세벤스라움의 완성"
 SED_complete_sebensraum_desc:0 "전쟁의 승리를 바탕으로 세드만족의 역사적 생활권을 하나의 국가체계로 통합한다."
 SED_proclaim_sedmania:0 "세드마니아 선포"
 SED_proclaim_sedmania_desc:0 "세드만족 역사의 완성을 선언하고 새로운 초강대국 세드마니아의 탄생을 선포한다."
 SED_build_the_industry:0 "산업 기반 확충"
 SED_build_the_industry_desc:0 "국가의 산업력을 강화하고 생산 기반을 확보한다."
 SED_strengthen_the_state:0 "국가 역량 강화"
 SED_strengthen_the_state_desc:0 "정부의 통제력과 국민의 결속을 높인다."
